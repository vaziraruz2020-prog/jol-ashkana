services:
  db:
    image: postgres:16-alpine
    container_name: jol-ashkana-db
    environment:
      POSTGRES_USER: jol
      POSTGRES_PASSWORD: jol
      POSTGRES_DB: jol_ashkana
    ports:
      - "5432:5432"
    volumes:
      - jol_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jol -d jol_ashkana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jol_pg:
